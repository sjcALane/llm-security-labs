[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seclab"
version = "0.1.0"
description = "Fine-tune, attack, defend and deploy a small LLM phishing detector. A lab series for computer security courses."
readme = "README.md"
license = "MIT"
authors = [{ name = "Andrew Lane" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.56",
    "peft>=0.17",
    "huggingface_hub>=0.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6"]

[tool.setuptools]
packages = ["seclab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
