name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      notebooks:
        description: "Also run every notebook in smoke mode"
        type: boolean
        default: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: pytest -q

  notebooks:
    if: github.event_name == 'workflow_dispatch' && inputs.notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SECLAB_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: python scripts/run_notebooks.py
